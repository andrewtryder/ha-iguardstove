[project]
name = "ha-iguardstove"
version = "0.0.0"
description = "Home Assistant custom integration for iGuardStove / iGuardFire devices"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "beautifulsoup4>=4.12.3",
]

[dependency-groups]
dev = [
    "aresponses==3.0.0",
    "beautifulsoup4==4.12.3",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.373",
    "pytest-socket==0.8.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components/iguardstove --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C4",     # flake8-comprehensions
    "B",      # flake8-bugbear
    "ASYNC",  # flake8-async
    "UP",     # pyupgrade
    "RUF",    # ruff-specific rules
    "SIM",    # flake8-simplify
    "PERF",   # perflint
    "FA",     # flake8-future-annotations
]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
show_error_codes = true
ignore_missing_imports = true
files = ["custom_components", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*", "tests"]
ignore_errors = true
